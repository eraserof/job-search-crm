# Allow ArchUnit rules to pass when the `that()` clause matches no classes.
#
# Rationale: our architecture rules are "prevention" style — they encode
# invariants like "no class in domain should depend on infrastructure".
# They should hold in an empty codebase and continue to hold as code is
# added. ArchUnit's default (failOnEmptyShould=true) fires false positives
# early in the project when packages exist as skeletons only.
#
# Individual rules can still opt in to strict empty-match failure by
# omitting `.allowEmptyShould(true)` if that stricter behaviour is wanted
# later — but the sensible default here is to trust the rule specification.
archRule.failOnEmptyShould=false
