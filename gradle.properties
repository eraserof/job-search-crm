# Use only JDKs that Gradle provisions itself (under ~/.gradle/jdks), for both the build daemon
# (see gradle/gradle-daemon-jvm.properties) and the Java 25 compile toolchain. Without this, Gradle
# also picks up JDKs it finds on the machine (JAVA_HOME, PATH, IDE bundles), and a self-updating or
# half-updated IDE JDK broke google-java-format (Spotless) on this machine.
org.gradle.java.installations.auto-detect=false
